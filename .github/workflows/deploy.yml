name: Deploy

on:
  push:
    branches: [main, mods, arena]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: mods
          path: mods
      - uses: actions/checkout@v4
        with:
          ref: arena
          path: arena
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: main/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build main
        working-directory: main/web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: build mods
        working-directory: mods/web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: build arena
        working-directory: arena/web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: assemble
        run: |
          mkdir -p site
          cp -r main/web/dist/. site/
          mkdir -p site/mods
          cp -r mods/web/dist/. site/mods/
          mkdir -p site/arena
          cp -r arena/web/dist/. site/arena/
          mkdir -p site/godot
          cp -r arena/godot-web/. site/godot/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
